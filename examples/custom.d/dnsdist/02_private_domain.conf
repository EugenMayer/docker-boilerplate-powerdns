--- ensure SOA and NS always going to our public DNS - important for ACME dns challenges, which want to know
--- what the primary DNS server for a domain is, which the SOA/NS query will answer
addAction(QTypeRule(DNSQType.SOA), PoolAction('recursors'))
addAction(QTypeRule(DNSQType.NS), PoolAction('recursors'))
addAction('test.local', PoolAction('auths'))
